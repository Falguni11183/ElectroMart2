{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Order Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        :root {
            --em-bg: #0b1120;
            --em-surface: #141b2e;
            --em-surface-2: #1b2338;
            --em-cyan: #00e0c6;
            --em-amber: #ffb627;
            --em-text: #eef2f8;
            --em-muted: #94a3b8;
            --em-border: rgba(238, 242, 248, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--em-bg) !important;
            color: var(--em-text);
            font-family: 'Inter', sans-serif;
        }

        h2, h4 {
            font-family: 'Space Grotesk', sans-serif;
        }

        h2 {
            font-weight: 700;
            position: relative;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        h2::after {
            content: "";
            display: block;
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, var(--em-cyan), var(--em-amber));
            border-radius: 3px;
            margin-top: 0.7rem;
        }

        /* Table */

        .table {
            background-color: var(--em-surface);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--em-border);
            color: var(--em-text);
        }

        .table > :not(caption) > * > * {
            border-bottom-color: var(--em-border);
            border-top: none;
            background-color: transparent;
            color: var(--em-text);
            vertical-align: middle;
            padding: 0.9rem 1rem;
        }

        .table-bordered {
            border: none;
        }

        .table-bordered > :not(caption) > * {
            border-width: 0;
        }

        .table-dark {
            --bs-table-bg: var(--em-surface-2);
            --bs-table-color: var(--em-muted);
        }

        thead.table-dark th {
            background-color: var(--em-surface-2) !important;
            color: var(--em-muted) !important;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 1px solid var(--em-border) !important;
        }

        .table tbody tr:hover {
            background-color: var(--em-surface-2);
        }

        .table tbody td:nth-child(2) {
            color: var(--em-amber);
            font-weight: 600;
        }

        /* Total */

        .text-success {
            color: var(--em-amber) !important;
            font-weight: 700;
            margin: 1.5rem 0;
        }

        /* Back button */

        .btn-secondary {
            background-color: transparent;
            border: 1.5px solid var(--em-border);
            color: var(--em-muted);
            font-weight: 600;
            border-radius: 8px;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        .btn-secondary:hover {
            border-color: var(--em-cyan);
            color: var(--em-cyan);
            background-color: transparent;
        }

    </style>

</head>

<body>

<div class="container mt-5">

<h2>Order #{{ order.id }}</h2>

<table class="table table-bordered">

<thead class="table-dark">

<tr>

<th>Product</th>

<th>Price</th>

<th>Quantity</th>

</tr>

</thead>

<tbody>

{% for item in items %}

<tr>

<td>{{ item.product.name }}</td>

<td>₹{{ item.price }}</td>

<td>{{ item.quantity }}</td>

</tr>

{% endfor %}

</tbody>

</table>

<h4 class="text-success">

Total : ₹{{ order.total_amount }}

</h4>

<a href="/orders/" class="btn btn-secondary">

Back

</a>

</div>

</body>
</html>
