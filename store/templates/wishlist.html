{% load static %}

<!DOCTYPE html>
<html>
<head>

<title>My Wishlist</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

    :root {
        --em-bg: #0b1120;
        --em-surface: #141b2e;
        --em-surface-2: #1b2338;
        --em-cyan: #00e0c6;
        --em-amber: #ffb627;
        --em-text: #eef2f8;
        --em-muted: #94a3b8;
        --em-border: rgba(238, 242, 248, 0.08);
    }

    * {
        box-sizing: border-box;
    }

    body {
        background-color: var(--em-bg) !important;
        color: var(--em-text);
        font-family: 'Inter', sans-serif;
    }

    h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        color: var(--em-text);
        position: relative;
        display: inline-block;
    }

    h2::after {
        content: "";
        display: block;
        width: 80px;
        height: 3px;
        background: linear-gradient(90deg, var(--em-cyan), var(--em-amber));
        border-radius: 3px;
        margin-top: 0.7rem;
    }

    /* Table */

    .table {
        background-color: var(--em-surface);
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid var(--em-border);
        color: var(--em-text);
    }

    .table > :not(caption) > * > * {
        border-bottom-color: var(--em-border);
        border-top: none;
        background-color: transparent;
        color: var(--em-text);
        vertical-align: middle;
        padding: 0.9rem 1rem;
    }

    .table-bordered {
        border: none;
    }

    .table-bordered > :not(caption) > * {
        border-width: 0;
    }

    .table tr:first-child {
        background-color: var(--em-surface-2);
    }

    .table tr:first-child th {
        color: var(--em-muted);
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        border-bottom: 1px solid var(--em-border);
    }

    .table tr:not(:first-child):hover {
        background-color: var(--em-surface-2);
    }

    .table td:nth-child(2) {
        color: var(--em-amber);
        font-weight: 700;
    }

    /* Buttons */

    .btn-success {
        background: linear-gradient(90deg, var(--em-cyan), #00b8a3);
        border: none;
        color: #052923;
        font-weight: 600;
        border-radius: 6px;
    }

    .btn-success:hover {
        color: #052923;
        box-shadow: 0 4px 14px rgba(0, 224, 198, 0.3);
    }

    .btn-danger {
        background-color: transparent;
        border: 1.5px solid #e24b4a;
        color: #f0a3a3;
        font-weight: 600;
        border-radius: 6px;
    }

    .btn-danger:hover {
        background-color: #e24b4a;
        color: #ffffff;
    }

    .btn-primary {
        background: linear-gradient(90deg, var(--em-cyan), #00b8a3);
        border: none;
        color: #052923;
        font-weight: 600;
        border-radius: 8px;
        padding: 0.6rem 1.6rem;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(0, 224, 198, 0.3);
        color: #052923;
    }

    /* Empty state */

    .alert-info {
        background-color: rgba(0, 224, 198, 0.08);
        border: 1px solid rgba(0, 224, 198, 0.3);
        color: var(--em-cyan);
        border-radius: 10px;
    }

</style>

</head>

<body>

<div class="container mt-5">

<h2 class="mb-4">My Wishlist ❤️</h2>

{% if wishlist %}

<table class="table table-bordered">

<tr>

<th>Product</th>

<th>Price</th>

<th>Action</th>

</tr>

{% for item in wishlist %}

<tr>

<td>{{ item.product.name }}</td>

<td>₹{{ item.product.price }}</td>

<td>

<a href="{% url 'add_to_cart' item.product.id %}"
class="btn btn-success btn-sm">

Add to Cart

</a>

<a href="{% url 'remove_from_wishlist' item.id %}"
class="btn btn-danger btn-sm">

Remove

</a>

</td>

</tr>

{% endfor %}

</table>

{% else %}

<div class="alert alert-info">

Wishlist is Empty.

</div>

{% endif %}

<a href="{% url 'products' %}" class="btn btn-primary">

Continue Shopping

</a>

</div>

</body>
</html>
