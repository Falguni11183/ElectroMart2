<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            background: #0f1729;
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 360px;
        }

        .login-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(45, 212, 191, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 22px;
        }

        h2 {
            color: #f8fafc;
            text-align: center;
            font-weight: 600;
            margin: 0;
        }

        .header-underline {
            width: 56px;
            height: 3px;
            background: #2dd4bf;
            border-radius: 2px;
            margin: 8px auto 1.5rem;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px 12px;
            color: #f1f5f9;
            font-size: 0.9rem;
            margin-bottom: 14px;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #2dd4bf;
            box-shadow: 0 0 0 2px rgba(45, 212, 191, 0.2);
        }

        input::placeholder {
            color: #64748b;
        }

        button[type="submit"] {
            width: 100%;
            background: rgba(45, 212, 191, 0.15);
            border: none;
            color: #2dd4bf;
            border-radius: 10px;
            padding: 11px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button[type="submit"]:hover {
            background: rgba(45, 212, 191, 0.25);
        }

        .messages p {
            background: rgba(244, 63, 94, 0.15);
            color: #fb7185;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
            margin-top: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-card">

    <div class="login-icon">🔒</div>

    <h2>Admin Login</h2>
    <div class="header-underline"></div>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>

    </form>

    <div class="messages">
        {% for message in messages %}
        <p>{{ message }}</p>
        {% endfor %}
    </div>

</div>

</body>
</html>
