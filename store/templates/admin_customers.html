<!DOCTYPE html>
<html>
<head>
    <title>Manage Customers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0a0f1e;
        }

        .container h2 {
            color: #f8fafc;
            font-weight: 600;
        }

        .table {
            background: #0f1729;
            color: #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
        }

        .table thead.table-dark th {
            background: #0f1729;
            color: #94a3b8;
            border-color: #1e293b;
            font-size: 0.78rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .table td, .table th {
            border-color: #1e293b;
            vertical-align: middle;
        }

        .table-striped > tbody > tr:nth-of-type(odd) > * {
            background-color: #131c30;
            color: #e2e8f0;
        }

        .table-striped > tbody > tr:nth-of-type(even) > * {
            background-color: #0f1729;
            color: #e2e8f0;
        }

        .customer-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: #2dd4bf;
            background: rgba(45, 212, 191, 0.15);
            flex-shrink: 0;
        }

        .fullname-text {
            color: #f1f5f9;
            font-weight: 500;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #334155;
            color: #cbd5e1;
            border-radius: 24px;
            padding: 8px 22px;
        }

        .btn-secondary:hover {
            background: #1e293b;
            color: #fff;
            border-color: #334155;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">👤 Manage Customers</h2>

    <table class="table table-bordered table-striped shadow">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone</th>
            </tr>
        </thead>

        <tbody>

        {% for customer in customers %}

        <tr>
            <td>{{ customer.id }}</td>
            <td>
                <div class="customer-name">
                    <div class="avatar">{{ customer.fullname|slice:":1" }}</div>
                    <span class="fullname-text">{{ customer.fullname }}</span>
                </div>
            </td>
            <td>{{ customer.email }}</td>
            <td>{{ customer.phone }}</td>
        </tr>

        {% empty %}

        <tr>
            <td colspan="4" class="text-center">
                No Customers Found
            </td>
        </tr>

        {% endfor %}

        </tbody>

    </table>

    <a href="{% url 'dashboard' %}" class="btn btn-secondary">
        Back to Dashboard
    </a>

</div>

</body>
</html>
