{% load static %}

<!DOCTYPE html>
<html>

<head>

<title>Edit Product</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

    :root {
        --em-bg: #0b1120;
        --em-surface: #141b2e;
        --em-surface-2: #1b2338;
        --em-cyan: #00e0c6;
        --em-amber: #ffb627;
        --em-text: #eef2f8;
        --em-muted: #94a3b8;
        --em-border: rgba(238, 242, 248, 0.08);
    }

    * {
        box-sizing: border-box;
    }

    body {
        background-color: var(--em-bg) !important;
        color: var(--em-text);
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
    }

    h2 {
        font-family: 'Space Grotesk', sans-serif;
    }

    .card {
        background-color: var(--em-surface);
        border: 1px solid var(--em-border);
        border-radius: 16px;
        position: relative;
        overflow: hidden;
    }

    .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at 15% 0%, rgba(0, 224, 198, 0.14), transparent 45%),
            radial-gradient(circle at 100% 100%, rgba(255, 182, 39, 0.10), transparent 45%);
        pointer-events: none;
    }

    .card > * {
        position: relative;
    }

    h2.text-center {
        font-weight: 700;
        color: var(--em-text);
    }

    h2.text-center::after {
        content: "";
        display: block;
        width: 80px;
        height: 3px;
        background: linear-gradient(90deg, var(--em-cyan), var(--em-amber));
        border-radius: 3px;
        margin: 0.8rem auto 0;
    }

    label {
        color: var(--em-muted);
        font-size: 0.85rem;
        font-weight: 500;
        margin-bottom: 0.35rem;
        display: block;
    }

    .form-control {
        background-color: var(--em-surface-2);
        border: 1px solid var(--em-border);
        color: var(--em-text);
        border-radius: 8px;
        padding: 0.6rem 0.9rem;
    }

    .form-control::placeholder {
        color: #64748b;
    }

    .form-control:focus {
        background-color: var(--em-surface-2);
        border-color: var(--em-cyan);
        color: var(--em-text);
        box-shadow: 0 0 0 0.2rem rgba(0, 224, 198, 0.2);
    }

    textarea.form-control {
        resize: vertical;
    }

    .btn-success {
        background: linear-gradient(90deg, var(--em-cyan), #00b8a3);
        border: none;
        color: #052923;
        font-weight: 600;
        border-radius: 8px;
        padding: 0.65rem 0;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-success:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 224, 198, 0.3);
        color: #052923;
    }

    .btn-secondary {
        background-color: transparent;
        border: 1.5px solid var(--em-border);
        color: var(--em-muted);
        font-weight: 600;
        border-radius: 8px;
        transition: border-color 0.2s ease, color 0.2s ease;
    }

    .btn-secondary:hover {
        border-color: var(--em-cyan);
        color: var(--em-cyan);
        background-color: transparent;
    }

</style>

</head>

<body>

<div class="container mt-5">

<div class="card shadow p-4">

<h2 class="text-center mb-4">
✏ Edit Product
</h2>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Product Name</label>

<input
type="text"
name="name"
class="form-control"
value="{{ product.name }}"
required>

</div>

<div class="mb-3">

<label>Category</label>

<input
type="text"
name="category"
class="form-control"
value="{{ product.category }}"
required>

</div>

<div class="mb-3">

<label>Price</label>

<input
type="number"
name="price"
class="form-control"
value="{{ product.price }}"
required>

</div>

<div class="mb-3">

<label>Description</label>

<textarea
name="description"
class="form-control"
rows="4">{{ product.description }}</textarea>

</div>

<div class="mb-3">

<label>Stock</label>

<input
type="number"
name="stock"
class="form-control"
value="{{ product.stock }}"
required>

</div>

<div class="mb-3">

<label>Image URL</label>

<input
type="text"
name="image"
class="form-control"
value="{{ product.image }}"
required>

</div>

<button class="btn btn-success w-100">

Update Product

</button>

<a href="{% url 'admin_products' %}"
class="btn btn-secondary w-100 mt-3">

Back

</a>

</form>

</div>

</div>

</body>

</html>
