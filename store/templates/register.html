{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ElectroMart</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>

        :root {
            --em-bg: #0b1120;
            --em-surface: #141b2e;
            --em-surface-2: #1b2338;
            --em-cyan: #00e0c6;
            --em-amber: #ffb627;
            --em-text: #eef2f8;
            --em-muted: #94a3b8;
            --em-border: rgba(238, 242, 248, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--em-bg) !important;
            color: var(--em-text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        h3 {
            font-family: 'Space Grotesk', sans-serif;
        }

        .card {
            background-color: var(--em-surface);
            border: 1px solid var(--em-border);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 15% 0%, rgba(0, 224, 198, 0.14), transparent 45%),
                radial-gradient(circle at 100% 100%, rgba(255, 182, 39, 0.10), transparent 45%);
            pointer-events: none;
        }

        .card-header {
            background: transparent !important;
            border-bottom: 1px solid var(--em-border);
            padding: 1.5rem 1.5rem 1.25rem;
            position: relative;
        }

        .card-header h3 {
            font-weight: 700;
            color: var(--em-text) !important;
            margin: 0;
        }

        .card-header::after {
            content: "";
            display: block;
            width: 70px;
            height: 3px;
            background: linear-gradient(90deg, var(--em-cyan), var(--em-amber));
            border-radius: 3px;
            margin: 0.75rem auto 0;
        }

        .card-body {
            position: relative;
            padding: 1.75rem 1.75rem 1.5rem;
        }

        .form-label {
            color: var(--em-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .form-control {
            background-color: var(--em-surface-2);
            border: 1px solid var(--em-border);
            color: var(--em-text);
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .form-control:focus {
            background-color: var(--em-surface-2);
            border-color: var(--em-cyan);
            color: var(--em-text);
            box-shadow: 0 0 0 0.2rem rgba(0, 224, 198, 0.2);
        }

        .btn-success {
            background: linear-gradient(90deg, var(--em-cyan), #00b8a3);
            border: none;
            color: #052923;
            font-weight: 600;
            border-radius: 8px;
            padding: 0.65rem 0;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 224, 198, 0.3);
            color: #052923;
        }

        hr {
            border-color: var(--em-border);
            opacity: 1;
        }

        .card-body p {
            color: var(--em-muted);
            font-size: 0.9rem;
        }

        .card-body p a {
            color: var(--em-cyan);
            font-weight: 600;
            text-decoration: none;
        }

        .card-body p a:hover {
            text-decoration: underline;
        }

        .alert-danger {
            background-color: rgba(226, 75, 74, 0.12);
            border: 1px solid rgba(226, 75, 74, 0.35);
            color: #f0a3a3;
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header text-center">
                    <h3>Create Account</h3>
                </div>

                <div class="card-body">

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'success' %}success{% else %}danger{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text"
                                   name="fullname"
                                   class="form-control"
                                   placeholder="Enter Full Name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Enter Email"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="text"
                                   name="phone"
                                   class="form-control"
                                   placeholder="Enter Phone Number"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter Password"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password"
                                   name="confirm_password"
                                   class="form-control"
                                   placeholder="Confirm Password"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Register
                        </button>

                    </form>

                    <hr>

                    <p class="text-center">
                        Already have an account?
                        <a href="{% url 'login' %}">Login</a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
