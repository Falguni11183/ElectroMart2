{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        :root {
            --em-bg: #0b1120;
            --em-surface: #141b2e;
            --em-surface-2: #1b2338;
            --em-cyan: #00e0c6;
            --em-amber: #ffb627;
            --em-text: #eef2f8;
            --em-muted: #94a3b8;
            --em-border: rgba(238, 242, 248, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--em-bg) !important;
            color: var(--em-text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        h3 {
            font-family: 'Space Grotesk', sans-serif;
        }

        .card {
            background-color: var(--em-surface);
            border: 1px solid var(--em-border);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 15% 0%, rgba(0, 224, 198, 0.14), transparent 45%),
                radial-gradient(circle at 100% 100%, rgba(255, 182, 39, 0.10), transparent 45%);
            pointer-events: none;
        }

        .card-header {
            background: transparent !important;
            border-bottom: 1px solid var(--em-border);
            padding: 1.5rem 1.5rem 1.25rem;
            position: relative;
            text-align: center;
        }

        .card-header h3 {
            font-weight: 700;
            color: var(--em-text) !important;
            margin: 0;
        }

        .card-header::after {
            content: "";
            display: block;
            width: 70px;
            height: 3px;
            background: linear-gradient(90deg, var(--em-cyan), var(--em-amber));
            border-radius: 3px;
            margin: 0.75rem auto 0;
        }

        .card-body {
            position: relative;
            padding: 1.75rem 2rem 1.5rem;
        }

        label {
            color: var(--em-muted);
            font-size: 0.85rem;
            font-weight: 500;
            display: block;
            margin-bottom: 0.35rem;
        }

        .form-control, .form-select {
            background-color: var(--em-surface-2);
            border: 1px solid var(--em-border);
            color: var(--em-text);
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .form-control:focus, .form-select:focus {
            background-color: var(--em-surface-2);
            border-color: var(--em-cyan);
            color: var(--em-text);
            box-shadow: 0 0 0 0.2rem rgba(0, 224, 198, 0.2);
        }

        .form-select option {
            background-color: var(--em-surface-2);
            color: var(--em-text);
        }

        textarea.form-control {
            resize: vertical;
        }

        .btn-success {
            background: linear-gradient(90deg, var(--em-cyan), #00b8a3);
            border: none;
            color: #052923;
            font-weight: 600;
            border-radius: 8px;
            padding: 0.7rem 0;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 224, 198, 0.3);
            color: #052923;
        }

    </style>

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card shadow">

<div class="card-header">

<h3>Checkout</h3>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">
<label>Name</label>
<input type="text" name="name" class="form-control" required>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control" required>
</div>

<div class="mb-3">
<label>Phone</label>
<input type="text" name="phone" class="form-control" required>
</div>

<div class="mb-3">
<label>Address</label>
<textarea name="address" class="form-control" rows="3"></textarea>
</div>

<div class="mb-3">
<label>Pincode</label>
<input type="text" name="pincode" class="form-control" required>
</div>

<div class="mb-3">

<label>Payment Method</label>

<select class="form-select" name="payment">

<option>Cash On Delivery</option>

<option>UPI</option>

<option>Credit Card</option>

<option>Debit Card</option>

</select>

</div>

<button class="btn btn-success w-100">

Place Order

</button>

</form>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
