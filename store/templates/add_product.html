<!DOCTYPE html>
<html>

<head>

    <title>Add Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0a0f1e;
        }

        .card {
            background: #0f1729;
            border: none;
            border-radius: 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        .card h2 {
            color: #f8fafc;
            font-weight: 600;
            font-size: 1.4rem;
        }

        label {
            font-size: 0.78rem;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
            display: block;
        }

        .form-control {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #f1f5f9;
            padding: 10px 12px;
            font-size: 0.9rem;
        }

        .form-control:focus {
            background-color: #1e293b;
            color: #f1f5f9;
            border-color: #2dd4bf;
            box-shadow: 0 0 0 2px rgba(45, 212, 191, 0.2);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .btn-success {
            background: rgba(45, 212, 191, 0.15);
            border: none;
            color: #2dd4bf;
            border-radius: 10px;
            padding: 11px;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .btn-success:hover {
            background: rgba(45, 212, 191, 0.25);
            color: #2dd4bf;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #334155;
            color: #cbd5e1;
            border-radius: 10px;
            padding: 11px;
        }

        .btn-secondary:hover {
            background: #1e293b;
            color: #fff;
            border-color: #334155;
        }
    </style>

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow p-4">

<h2 class="text-center mb-4">

➕ Add New Product

</h2>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Product Name</label>

<input type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Category</label>

<input type="text"
name="category"
class="form-control"
placeholder="Mobile, Laptop, Earbuds..."
required>

</div>

<div class="mb-3">

<label>Price</label>

<input type="number"
name="price"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Description</label>

<textarea
name="description"
class="form-control"
rows="4"
required></textarea>

</div>

<div class="mb-3">

<label>Stock</label>

<input type="number"
name="stock"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Image URL</label>

<input type="text"
name="image"
class="form-control"
placeholder="https://..."
required>

</div>

<button class="btn btn-success w-100">

Add Product

</button>

<a href="{% url 'admin_products' %}"
class="btn btn-secondary w-100 mt-3">

Back

</a>

</form>

</div>

</div>

</body>

</html>
